name: CI/CD Cloud - Backend (Java 21, JaCoCo, Semgrep, SonarCloud)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-security:
    name: Build, Pruebas (54), JaCoCo, Semgrep y SonarCloud
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout codigo fuente (con historial completo para SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar JDK 21 (Temurin) y cache de Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Inicializar esquema SQL y validar integridad RDBMS en PostgreSQL 16
        env:
          PGPASSWORD: ci_ephemeral_password
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -p 5432 -U neondb_owner -d neondb -v ON_ERROR_STOP=1 -f sql/neon-dbgestor-schema-and-data.sql
          psql -h localhost -p 5432 -U neondb_owner -d neondb -v ON_ERROR_STOP=1 -f sql/verify-schema-and-integrity.sql

      - name: 4. Compilar, ejecutar pruebas unitarias (54) y generar reporte JaCoCo 0.8.12
        env:
          DB_URL: jdbc:postgresql://localhost:5432/neondb
          DB_USER: neondb_owner
          DB_PASSWORD: ci_ephemeral_password
        run: |
          chmod +x mvnw
          ./mvnw clean verify jacoco:report -B

      - name: 5. Escaneo SAST con Semgrep (excluyendo target/)
        run: |
          mkdir -p reports
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config=auto \
            --exclude='target' \
            --exclude='*.class' \
            --exclude='*.jar' \
            --json \
            --output=reports/semgrep-backend.json \
            src pom.xml Dockerfile || true

      - name: 6. Analisis de Calidad y Cobertura en SonarCloud
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION || 'desarrollo-web-profesional-zrodriguez' }}
          SONAR_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Desarrollo-Web-Profesional-zrodriguez_admin-proyectos-gestor' }}
        run: |
          ./mvnw sonar:sonar -B \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="${SONAR_ORG}" \
            -Dsonar.projectKey="${SONAR_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: 7. Validar construccion de imagen Docker (multi-stage)
        run: docker build -t admin-proyectos/api-gestor:ci .

      - name: 8. Archivar artefactos (JaCoCo, Surefire y Semgrep)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ci-backend
          path: |
            target/site/jacoco/
            target/surefire-reports/
            reports/semgrep-backend.json
          retention-days: 30
